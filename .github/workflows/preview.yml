name: Preview

# Uploads a preview version of the web Worker (staging configuration and data) under the alias
# pr-<number> and comments its URL. Forks and repos without Cloudflare secrets skip with a notice.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not available (fork or unconfigured repository); skipping preview upload."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.available == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.available == 'true'

      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.available == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.secrets.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and upload preview version
        id: upload
        if: steps.secrets.outputs.available == 'true'
        run: |
          set -euo pipefail
          CLOUDFLARE_ENV=staging pnpm --filter @marketplace/web build
          pnpm --filter @marketplace/web exec wrangler versions upload --preview-alias "$PREVIEW_ALIAS" | tee /tmp/upload.log
          url=$(grep -oE "https://${PREVIEW_ALIAS}-[A-Za-z0-9.-]+" /tmp/upload.log | head -n1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: |
          if [ -n "$PREVIEW_URL" ]; then
            body="Preview for ${GITHUB_SHA::7}: $PREVIEW_URL (staging data)"
          else
            body="Preview version uploaded for ${GITHUB_SHA::7} as alias $PREVIEW_ALIAS; see the workflow log for its URL."
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" \
            || gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
