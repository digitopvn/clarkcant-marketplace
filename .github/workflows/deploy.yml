name: Deploy

# dev -> staging, main -> production. Each environment's public URL lives in the GitHub
# environment variable SITE_URL (https://staging.marketplace.clarkcant.cc, https://marketplace.clarkcant.cc).

on:
  push:
    branches: [dev, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm migrations:check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ vars.SITE_URL }}
    # Read-only: install scripts and the build run in this job next to the Cloudflare token. Tagging is a separate job.
    permissions:
      contents: read
    env:
      TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check deployment configuration
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(variable)"
          [ -n "$SITE_URL" ] || missing="$missing SITE_URL(environment variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing deployment configuration for $TARGET_ENV:$missing"
            exit 1
          fi

      # --config names the source wrangler.jsonc so a build-generated redirect (.wrangler/deploy/config.json) can never
      # re-target the migrations at another environment's database.
      - name: D1 migrations (before)
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations list DB --remote --config wrangler.jsonc --env "$TARGET_ENV"

      - name: Apply D1 migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.jsonc --env "$TARGET_ENV"

      - name: D1 migrations (after)
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations list DB --remote --config wrangler.jsonc --env "$TARGET_ENV"

      # The jobs Worker owns the Workflow class the web Worker binds to, so it deploys first.
      - name: Deploy jobs worker
        working-directory: apps/jobs
        run: pnpm exec wrangler deploy --env "$TARGET_ENV"

      # The Astro adapter bakes the selected wrangler environment into the generated deploy config.
      - name: Build and deploy web worker
        run: |
          CLOUDFLARE_ENV="$TARGET_ENV" pnpm --filter @marketplace/web build
          pnpm --filter @marketplace/web exec wrangler deploy

      - name: Smoke test deployed site
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$base/api/v1/health" || true)
            [ "$code" = "200" ] && break
            echo "health returned $code (attempt $attempt); retrying"; sleep 5
          done
          [ "$code" = "200" ] || { cat /tmp/health.json; exit 1; }
          grep -q '"status":"ok"' /tmp/health.json
          # Download first: with pipefail, `curl | grep -q` fails when grep exits early and curl gets SIGPIPE.
          curl -sf -o /tmp/openapi.json "$base/openapi.json"
          grep -q '"openapi":"3.1' /tmp/openapi.json
          curl -sf -o /tmp/home.html "$base/"
          grep -q 'ClarkCant Marketplace' /tmp/home.html
          echo "Smoke tests passed for $base"

      # Staging is a production build, so the built-only checks (hashed CSP, JavaScript budget) run here. The page
      # builder flow runs only when the E2E_ADMIN_EMAIL / E2E_ADMIN_PASSWORD secrets exist (docs/deployment.md).
      - name: Playwright critical paths against staging
        if: env.TARGET_ENV == 'staging'
        env:
          E2E_BUILT: "1"
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          pnpm exec playwright install --with-deps chromium
          BASE_URL="$SITE_URL" pnpm test:e2e

  release-tag:
    name: Release marker
    needs: deploy
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag the deployed commit
        run: |
          tag="release-$(date -u +%Y%m%d-%H%M)"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "Tagged $tag"
